[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immo-estimateur"
version = "0.1.0"
description = "Estimateur de valeur immobilière pour appartements en France"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "geopy>=2.4",
    "shapely>=2.0",
    "geopandas>=0.14",
    "scikit-learn>=1.3",
    "shap>=0.43",
    "pandas>=2.1",
    "numpy>=1.26",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "SQLAlchemy>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "folium>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
immo = "immo.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
